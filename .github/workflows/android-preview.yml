name: Android Preview Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pixel-exact LENSIGO launcher from approved source
        run: |
          python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 CairoSVG==2.8.2
          python tools/generate_launcher.py app/src/main/res/mipmap-nodpi/lensigo_launcher.png \
            --adaptive-foreground app/src/main/res/drawable-nodpi/lensigo_launcher_foreground.png
      - name: Audit all user-visible Android text
        run: python tools/audit_public_ui.py
      - name: Audit Android security and privacy contracts
        run: python tools/security_audit.py
      - name: Pixel audit and Play package unit checks
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Install SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace
      - name: Show complete lint report on failure
        if: failure()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
      - name: Verify package format and absence of unverified native code
        run: python tools/play_package_check.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab
      - name: Prepare checksums and accurate preview release notes
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1 "  app-debug.apk"}' > SHA256SUMS.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab | awk '{print $1 "  app-release.aab"}' >> SHA256SUMS.txt
          {
            echo "LENSIGO v0.7.${{ github.run_number }} — Android preview"
            echo
            echo "Current commit: ${GITHUB_SHA}"
            echo "Change: $(git log -1 --pretty=%s)"
            echo
            echo "Includes debug-signed APK and unsigned AAB; not a production/Play-signed release."
            echo "App screenshots and 1:1 pixel equivalence require physical-device verification."
            echo "SHA256SUMS.txt verifies downloaded APK/AAB integrity."
          } > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: lensigo-android-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            SHA256SUMS.txt
      - name: Upload Android lint report
        uses: actions/upload-artifact@v4
        with:
          name: lensigo-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Publish verified preview release
        env:
          # Optional fine-grained PAT (Contents: read/write on this repo).
          # Without it, attempt the built-in token; artifacts are already uploaded.
          GH_TOKEN: ${{ secrets.LENSIGO_RELEASE_TOKEN || github.token }}
        run: |
          TAG="v0.7.${{ github.run_number }}"
          # Respect transient GitHub App token/rate-limit failures. Do not
          # report a successful release until the API confirms publication.
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if result=$(gh release upload "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab SHA256SUMS.txt --clobber 2>&1); then
                exit 0
              fi
            else
              if result=$(gh release create "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "LENSIGO $TAG · Android preview" --notes-file release-notes.md 2>&1); then
                exit 0
              fi
            fi
            printf '%s\n' "$result"
            if printf '%s' "$result" | grep -q "Resource not accessible by integration"; then
              echo "::error::GitHub denied release publication (HTTP 403). APK/AAB remain in Actions artifacts, but release delivery FAILED. Configure LENSIGO_RELEASE_TOKEN (Contents: write); see docs/RELEASE-PUBLISHING.md."
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::GitHub Release cannot be published with the current token permissions. APK/AAB remain available as Actions artifacts."
              exit 1
            fi
            echo "::warning::Retrying GitHub Release after an unsuccessful API response (attempt $attempt of 4)."
            sleep "$((attempt * 10))"
          done
