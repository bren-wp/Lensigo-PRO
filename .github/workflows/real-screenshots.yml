name: Real Android Screenshots

on:
  workflow_run:
    workflows: ["Android Preview Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  screenshot:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LENSIGO_RELEASE_TOKEN || github.token }}
          ref: main
      - name: Acquire real previously built debug APK
        env:
          GH_TOKEN: ${{ secrets.LENSIGO_RELEASE_TOKEN || github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          RUN_ID="$SOURCE_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow=android-preview.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --name lensigo-android-preview --dir preview-apk
          APK=$(find preview-apk -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          cp "$APK" preview-debug.apk
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real Android application screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 tools/capture_real_screenshots.py preview-debug.apk docs/screenshots/real
      - name: Retain authentic PNG screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lensigo-real-android-screenshots
          path: docs/screenshots/real
          if-no-files-found: warn
      - name: Publish screenshots and README without a PR
        shell: bash
        run: |
          test -s docs/screenshots/real/02_onboarding.png
          test -s docs/screenshots/real/03_permissions.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots/real
          if git diff --cached --quiet; then
            echo "Verified screenshots already present."
            exit 0
          fi
          git commit -m "docs(screenshots): genuine Android emulator captures [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
